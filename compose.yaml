services:
  db:
    image: postgres:16-alpine
    container_name: cargo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"        # убрать наружу, если не нужно с хоста
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-bot:latest
    container_name: cargo-bot
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      # Spring Boot
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-master.yaml
      SPRING_LIQUIBASE_CONTEXTS: dev
      SPRING_MAIN_ALLOW-CIRCULAR-REFERENCES: "true"

      # Ваши кастомные проперти
      FACTOR_VOLUMETRIC_WEIGHT: ${FACTOR_VOLUMETRIC_WEIGHT}
      ADMIN_ID: ${ADMIN_ID}
      SERVER_PORT: 8084

      # Telegram
      BOT_TOKEN: ${BOT_TOKEN}

    # если нужно видеть логи в консоли
    tty: true
    restart: unless-stopped

volumes:
  db_data:

